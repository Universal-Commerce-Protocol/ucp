# Cloudflare Worker config for the ucp.dev "Ask AI" backend.
# Deploy: `npm run deploy` (see README.md). Optional secret: `wrangler secret put MODEL_API_KEY`.
name = "ucp-ask-ai"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain the widget talks to (configured in mkdocs.yml extra.ask_ai.endpoint).
routes = [{ pattern = "ask.ucp.dev", custom_domain = true }]

# KV holds the answer cache, per-IP counters and the daily budget counter.
# Create with: wrangler kv namespace create ASK_KV   (then paste the id here)
[[kv_namespaces]]
binding = "ASK_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Workers AI binding. Only needed when MODEL_PROVIDER = "workers-ai".
[ai]
binding = "AI"

[vars]
# Where answers come from. Two options:
#   "openai-compatible": your own model behind vLLM / Ollama / TGI / llama.cpp /
#                        SGLang / LM Studio (anything speaking /v1/chat/completions).
#                        Set MODEL_BASE_URL (e.g. https://llm.internal.example/v1)
#                        and MODEL to the served model name. If the server needs a
#                        key: `wrangler secret put MODEL_API_KEY`.
#   "workers-ai":        an open model hosted by Cloudflare through the AI binding,
#                        e.g. MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast".
MODEL_PROVIDER = "openai-compatible"
MODEL = "qwen2.5-14b-instruct"
MODEL_BASE_URL = "https://REPLACE_WITH_YOUR_MODEL_SERVER/v1"
# Low temperature: this is factual Q&A over excerpts.
TEMPERATURE = "0.2"
# Hard ceiling on generated tokens per answer. Prompt asks for <= ~200 words.
MAX_OUTPUT_TOKENS = "700"
# Comma-separated list of ask-index.json files written by the docs build.
INDEX_URLS = "https://ucp.dev/ask-index.json,https://ucp.dev/latest/ask-index.json"
# Browser origins allowed to call the API.
ALLOWED_ORIGINS = "https://ucp.dev"
# Retrieval: how many sections go into the prompt.
TOP_K = "8"
# Conversation memory sent back to the model (user+assistant pairs).
MAX_HISTORY_TURNS = "3"
# Abuse / spend guards.
PER_IP_HOURLY_LIMIT = "40"
DAILY_REQUEST_BUDGET = "5000"
# How long a cached answer to an identical question is reused (seconds).
ANSWER_CACHE_TTL = "604800"
# Anonymous question/answer log for docs-gap analysis and future fine-tuning
# (no IPs or identifiers; see src/log.ts). "off" disables. Export a day with
# GET /v1/export?day=YYYY-MM-DD and the EXPORT_TOKEN secret
# (`wrangler secret put EXPORT_TOKEN`).
LOG_ANSWERS = "on"
LOG_TTL_DAYS = "90"
