name: 'Setup Docs Build Environment'
description: 'Installs dependencies needed to build the UCP documentation'
runs:
  using: "composite"
  steps:
    - name: Install system dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev
    
    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        enable-cache: true
    
    - name: Install documentation dependencies
      shell: bash
      run: uv sync

    # ucp-schema is pinned to a revision in .ucp-schema-rev, so that a new
    # release cannot change lint, validation or generated output on a branch
    # without a commit that says so.
    - name: Read the pinned ucp-schema revision
      id: ucp-schema
      shell: bash
      run: echo "rev=$(tr -d '[:space:]' < .ucp-schema-rev)" >> "$GITHUB_OUTPUT"

    - name: Cache ucp-schema binary
      id: cache-ucp-schema
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/ucp-schema
        key: ${{ runner.os }}-ucp-schema-${{ steps.ucp-schema.outputs.rev }}

    - name: Install ucp-schema
      if: steps.cache-ucp-schema.outputs.cache-hit != 'true'
      shell: bash
      run: >-
        cargo install --locked
        --git https://github.com/Universal-Commerce-Protocol/ucp-schema
        --rev ${{ steps.ucp-schema.outputs.rev }}

    - name: Add cargo to PATH
      shell: bash
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH