name: 'Setup Docs Build Environment'
description: 'Installs dependencies needed to build the UCP documentation'
runs:
  using: "composite"
  steps:
    - name: Install system dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev
    
    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        enable-cache: true
    
    - name: Install documentation dependencies
      shell: bash
      run: uv sync

    # Pinned: ucp-schema 2.0.0 drops nested $ids from --bundle output, which
    # main.py uses to link Type cells in schema tables (#887). Bump once the
    # renderer no longer depends on them.
    - name: Cache ucp-schema binary
      id: cache-ucp-schema
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/ucp-schema
        key: ${{ runner.os }}-ucp-schema-1.4.1

    - name: Install ucp-schema
      if: steps.cache-ucp-schema.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install ucp-schema --version 1.4.1

    - name: Add cargo to PATH
      shell: bash
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH