---
name: "Setup Docs Build Environment"
description: "Installs dependencies needed to build the UCP documentation"
inputs:
  ucp-schema-version:
    description: "Pinned crates.io version of ucp-schema to install"
    required: false
    default: "1.4.1"
runs:
  using: "composite"
  steps:
    - name: Install system dependencies
      shell: bash
      run: >-
        sudo apt-get update && sudo apt-get install -y
        libcairo2-dev libfreetype6-dev libffi-dev
        libjpeg-dev libpng-dev libz-dev

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true

    - name: Install documentation dependencies
      shell: bash
      run: uv sync

    - name: Export pinned ucp-schema version
      shell: bash
      env:
        UCP_SCHEMA_VERSION: ${{ inputs.ucp-schema-version }}
      run: echo "UCP_SCHEMA_VERSION=$UCP_SCHEMA_VERSION" >> "$GITHUB_ENV"

    - name: Cache ucp-schema binary
      id: cache-ucp-schema
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cargo/bin/ucp-schema
        key: ${{ runner.os }}-ucp-schema-${{ inputs.ucp-schema-version }}

    - name: Install ucp-schema
      if: steps.cache-ucp-schema.outputs.cache-hit != 'true'
      shell: bash
      env:
        UCP_SCHEMA_VERSION: ${{ inputs.ucp-schema-version }}
      run: cargo install ucp-schema --version "$UCP_SCHEMA_VERSION"

    - name: Add cargo to PATH
      shell: bash
      run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
