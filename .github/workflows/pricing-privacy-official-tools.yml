name: Pricing privacy official schema and documentation checks

on:
  push:
    branches:
      - review/969-airshelf-pricing-privacy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned official UCP schema CLI
        run: |
          cargo install ucp-schema --version 1.4.1 --locked

      - name: Validate UCP source schemas with official CLI
        run: |
          ucp-schema --version
          ucp-schema lint source/

      - name: Validate changed specification examples
        run: |
          python3 scripts/validate_examples.py \
            --schema-base source/schemas/ \
            --file docs/specification/shopping/catalog/index.md \
                   docs/specification/shopping/catalog/search.md

      - name: Install documentation build environment
        run: |
          python3 -m pip install --disable-pip-version-check uv==0.9.4
          uv sync --frozen

      - name: Build strict draft documentation
        run: |
          uv run mkdocs build --strict
