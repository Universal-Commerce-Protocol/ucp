name: Reference Implementation

permissions: {}

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - ".github/actions/**"
      - ".github/workflows/reference.yml"
      - ".ucp-schema-rev"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "reference/**"
      - "source/**"

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build-env

      # Generates routes and types from this commit's schemas, runs the
      # example Platform against the example Business over REST and MCP, and
      # fails if the wire no longer matches reference/transcripts/.
      - name: Run the reference implementation
        run: make -C reference check
