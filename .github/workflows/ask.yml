name: Ask AI Worker

permissions: {}

on:
  pull_request:
    paths:
      - "ask/**"
      - ".github/workflows/ask.yml"
  push:
    branches:
      - main
    paths:
      - "ask/**"

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ask
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # ubuntu-latest ships a current Node LTS, which is all this needs.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
